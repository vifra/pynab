{% load i18n %}
<div class="card" id="nabmenudujour-settings">
  <form action="/nabmenudujour/settings">
    {% csrf_token %}
    <div class="card-header">
      <h5 class="card-title">{% trans "Menu du jour" %}</h5>
    </div>
    <div class="card-body">
      <p>{% trans "Configure the JSON URL that contains today's meal." %}</p>
      <div class="form-group row">
        <label for="menuDuJourJsonUrl" class="col-6 col-form-label">{% trans "JSON URL" %}</label>
        <div class="col-6">
          <input id="menuDuJourJsonUrl" name="json_url" type="url" class="form-control" value="{{ config.json_url }}" placeholder="https://example.com/menu.json">
        </div>
      </div>
      <div class="form-group row">
        <label class="col-6 col-form-label">{% trans "Meal" %}</label>
        <div class="col-6">
          <button type="button" class="btn btn-primary now-button">{% trans "Read now" %}</button>
          <button type="button" class="btn btn-outline-primary preview-button">{% trans "Preview" %}</button>
        </div>
      </div>
      <div class="menu-preview small text-muted"></div>
    </div>
    <div class="card-footer">
      <div class="row mb-2">
        <div class="col-12">
          <button type="submit" class="btn btn-primary disabled ml-2 float-right save-button">{% trans "Save" %}</button>
          <button type="reset" class="btn btn-outline-primary disabled ml-2 float-right reset-button">{% trans "Reset" %}</button>
        </div>
      </div>
    </div>
  </form>

  <script type="text/javascript">
  $(function() {
    var form = $('#nabmenudujour-settings form');
    var saveBtn = form.find('button.save-button');
    var resetBtn = form.find('button.reset-button');
    var url = form.attr('action');
    form.find('input').on('change', function() {
      saveBtn.removeClass('disabled');
      resetBtn.removeClass('disabled');
    });
    form.on('submit', function() {
      var formdata = form.serialize();
      $.ajax({
        url: url,
        method: "POST",
        data: formdata,
        success: function (data) {
          $("#nabmenudujour-settings").replaceWith(data);
        }
      });
      return false;
    });
    resetBtn.on("click", function() {
      $.get(url, function(data) {
        $("#nabmenudujour-settings").replaceWith(data);
      });
    });
    form.find('button.now-button').on("click", function() {
      var btn = $(this);
      btn.addClass('disabled');
      $.ajax({
        url: url,
        beforeSend: function (xhr, settings) {
          xhr.setRequestHeader("X-CSRFToken", form.find('input[name="csrfmiddlewaretoken"]').val());
        },
        data: form.serialize() + "&type=today",
        method: "PUT",
        complete: function () {
          btn.removeClass('disabled');
        }
      });
      return false;
    });
    form.find('button.preview-button').on("click", function() {
      var btn = $(this);
      btn.addClass('disabled');
      $.ajax({
        url: url,
        beforeSend: function (xhr, settings) {
          xhr.setRequestHeader("X-CSRFToken", form.find('input[name="csrfmiddlewaretoken"]').val());
        },
        data: form.serialize() + "&type=preview",
        method: "PUT",
        success: function (data) {
          if (data.status == "ok") {
            form.find('.menu-preview').text(data.meal.text);
          } else {
            form.find('.menu-preview').text(data.message);
          }
        },
        complete: function () {
          btn.removeClass('disabled');
        }
      });
      return false;
    });
  });
  </script>
</div>
