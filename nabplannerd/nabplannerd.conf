[loggers]
keys=root

[handlers]
keys=syslog

[formatters]
keys=generic

[logger_root]
level=INFO
handlers=syslog

[handler_syslog]
class=handlers.SysLogHandler
level=INFO
formatter=generic
args=('/dev/log', handlers.SysLogHandler.LOG_DAEMON)

[formatter_generic]
format=%(asctime)s [%(levelname)s] nabplannerd: %(message)s
