{% extends 'nabweb/_base.html' %}
{% load i18n %}
{% block subtitle %}{% trans "Services" %}{% endblock %}
{% block content %}
  <style>
    .services-color-page {
      padding: .25rem;
      border-radius: .5rem;
      background: #f8fafc;
    }
    .services-jump-list {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      margin-bottom: 1rem;
      padding: .75rem;
      border: 1px solid #d9e2ec;
      border-radius: .5rem;
      background: #fff;
    }
    .services-jump-list a {
      display: inline-block;
      padding: .25rem .5rem;
      border-radius: 999px;
      background: #eef2f7;
      color: #334155;
      font-size: .85rem;
    }
    .services-jump-list a:hover {
      background: #dbeafe;
      color: #1d4ed8;
      text-decoration: none;
    }
    .services-columns {
      column-count: 2;
      column-gap: 1rem;
    }
    .services-columns .settings {
      display: inline-block;
      width: 100%;
      margin-bottom: 1rem;
      break-inside: avoid;
    }
    .services-color-page .settings > .card {
      overflow: hidden;
      border-color: #d9e2ec;
      box-shadow: 0 .125rem .4rem rgba(15, 23, 42, .05);
    }
    .services-color-page .settings:nth-of-type(4n+1) > .card {
      border-top: 4px solid #2077b4;
    }
    .services-color-page .settings:nth-of-type(4n+2) > .card {
      border-top: 4px solid #27865a;
    }
    .services-color-page .settings:nth-of-type(4n+3) > .card {
      border-top: 4px solid #b45f06;
    }
    .services-color-page .settings:nth-of-type(4n+4) > .card {
      border-top: 4px solid #0f766e;
    }
    .services-color-page .settings > .card > .card-header {
      background: #fff;
    }
    @media (max-width: 767.98px) {
      .services-columns {
        column-count: 1;
      }
    }
  </style>
  <div class="services-color-page">
    <div class="services-jump-list">
      {% for service in services %}
      <a id="service-link-{{ forloop.counter }}" href="#service-{{ forloop.counter }}">{{ service }}</a>
      {% endfor %}
    </div>

    <div class="services-columns">
      {% for service in services %}
      <div id="service-{{ forloop.counter }}" class="settings" data-url="/{{ service }}/settings"></div>
      {% endfor %}
    </div>
  </div>
  <script type="text/javascript">
    $(function() {
      $("div.settings").each(function(index, element) {
        var url = $(element).data('url');
        $.get(url, function(data) {
          $(element).html(data);
          var title = $(element).find(".card-title").first().text().trim();
          if (title) {
            $("#service-link-" + (index + 1)).text(title);
          }
        });
      });
    });
  </script>
{% endblock %}
